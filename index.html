<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kahve Daveti</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f5f5f5;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 5vw;
    }

    .container {
        background: white;
        padding: 6vw;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 430px;
        transition: 0.3s ease;
    }

    h1 {
        font-size: clamp(18px, 5vw, 24px);
        margin-bottom: 5vw;
        transition: 0.3s ease;
    }

    .buttons {
        display: flex;
        flex-direction: column;
        gap: 4vw;
        transition: 0.3s ease;
    }

    button {
        width: 100%;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s ease;
        color: white;
        font-size: clamp(16px, 4vw, 20px);
        padding: 3vw 0;
        word-wrap: break-word;
    }

    .yes { background-color: #28a745; }
    .no { background-color: #dc3545; }

    .message {
        margin-top: 4vw;
        font-size: clamp(16px, 4vw, 22px);
        color: #333;
    }
</style>
</head>
<body>
<div class="container" id="container">
    <h1 id="title">Benimle bir akşam kahve içer misin?</h1>
    <div class="buttons" id="buttons">
        <button class="yes" id="yesBtn" onclick="kabul()">Evet</button>
        <button class="no" id="noBtn" onclick="degistir()">Tabi ki de hayır </button>
    </div>
    <div class="message" id="message"></div>
</div>

<script>
    let fontSize = 16;
    let paddingY = 12;
    let paddingX = 25;
    let i = 0;

    function degistir() {
        const noButton = document.getElementById('noBtn');
        const yesBtn = document.getElementById("yesBtn");

        // Hayır buton metinleri
        if(i==0){
            noButton.innerText = "Beni bunlarla kandıramazsınız beyefendi.";
        } 
        else if(i==1){
            noButton.innerText = "Hayatımda gördüğüm en kötü yazılımcısın, yaptığın şeye bak :)";
        } 
        else if(i==2){
            noButton.innerText = "Tipim değilsin.";
        } 
        else if(i==3){
            noButton.innerText = "Rüyanda görürsün.";
        }
        else if(i==4){
            noButton.remove();
        }

        i++;

        // Evet butonunu kademeli büyüt
        fontSize += 14;
        paddingY += 48;
        paddingX += 12;

        yesBtn.style.fontSize = fontSize + "px";
        yesBtn.style.padding = paddingY + "px " + paddingX + "px";
    }

    function kabul() {
        // Butonları sil
        const buttonsDiv = document.getElementById('buttons');
        buttonsDiv.remove();

        // Başlığı da istersen kaldırabiliriz
        const title = document.getElementById('title');
        title.remove();

        // Mesaj göster
        const message = document.getElementById('message');
        message.innerText = "Kabul edeceğini biliyordum. Ne zaman istersen haber et. Gelip alıyım seni ☕. Hadi bye bye :)";
    }
</script>
</body>
</html>
